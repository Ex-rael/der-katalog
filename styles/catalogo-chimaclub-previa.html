<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chima Club Artefatos — Catálogo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Marcellus&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* =========================================================
   IDENTIDADE CHIMA CLUB — paleta oficial
   ========================================================= */
:root{
  --creme:     #E9E0D0;
  --salvia:    #6D9571;
  --verde:     #0D3316;
  --nevoa:     #A7B3A2;
  --terracota: #84431D;
  --branco:    #FFFFFF;

  /* Fontes: Symphony → Pinyon Script | Awesome Lathusca → Marcellus | Nourd → Jost */
  --f-script: "Pinyon Script", "Snell Roundhand", "Apple Chancery", cursive;
  --f-display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --f-texto:  "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow-x:hidden}
body{
  background:var(--creme);color:var(--verde);
  font-family:var(--f-texto);font-weight:300;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit}

.sol-meio{display:block;width:clamp(150px,30vw,230px);height:auto;margin:0 auto}
.sol-baixo{transform:scaleY(-1)}

/* ---------- Abertura ---------- */
.abertura{
  background:var(--verde);color:var(--creme);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:72px 24px 88px;text-align:center;
}
.abertura .logo{width:min(420px,78vw);height:auto}
.divisor{
  display:flex;align-items:center;gap:18px;
  width:min(720px,100%);margin:clamp(40px,8vw,72px) auto;
  color:var(--salvia);
}
.divisor::before,.divisor::after{content:"";flex:1;height:1px;background:var(--nevoa);opacity:.6}
.divisor svg{width:52px;height:52px;flex:none}
.lema{
  font-family:var(--f-script);font-weight:400;
  font-size:clamp(2rem,6vw,3.4rem);line-height:1.25;
  max-width:18ch;
}
.sublema{margin-top:28px;font-size:clamp(1rem,2.4vw,1.2rem);max-width:34ch;font-weight:300}
.sublema em{font-style:normal;color:var(--nevoa)}
.indice{
  margin-top:56px;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;
}
.indice a{
  text-decoration:none;font-family:var(--f-display);font-size:1.05rem;
  border:1px solid color-mix(in srgb,var(--creme) 55%,transparent);
  padding:10px 22px;border-radius:999px;
}
.indice a:hover{background:var(--creme);color:var(--verde)}

/* ---------- Abertura de categoria (moldura) ---------- */
.categoria{background:var(--verde);color:var(--creme);padding:clamp(32px,6vw,56px) 20px}
.moldura{
  max-width:560px;margin:0 auto;
  border:1px solid var(--creme);
  padding:clamp(28px,6vw,48px) 20px;text-align:center;
}
.moldura .sol-meio{color:var(--creme);width:clamp(120px,26vw,180px)}
.categoria h2{
  font-family:var(--f-script);font-weight:400;
  font-size:clamp(2.8rem,9vw,4.4rem);line-height:1.1;
  margin:clamp(24px,6vw,44px) 0 10px;
}
.categoria .qtd{font-size:1rem;color:var(--nevoa);margin-bottom:clamp(24px,6vw,44px)}

/* ---------- Grade de produtos ---------- */
.produtos{
  max-width:1120px;margin:0 auto;
  padding:clamp(48px,8vw,88px) 20px 24px;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:clamp(36px,6vw,64px) clamp(16px,3vw,40px);
}
@media (min-width:900px){ .produtos{grid-template-columns:repeat(3,minmax(0,1fr))} }

.produto{position:relative;text-align:center}
.foto{
  position:relative;
  padding:8px;border:1px solid var(--verde);   /* moldura fina da marca */
}
.foto .quadro{aspect-ratio:4/5;overflow:hidden;background:var(--nevoa)}
.foto .quadro img{width:100%;height:100%;object-fit:cover}
.detalhe{
  position:absolute;right:-10px;bottom:-18px;
  width:clamp(64px,24%,104px);aspect-ratio:1;border-radius:50%;
  overflow:hidden;border:4px solid var(--creme);
  box-shadow:0 0 0 1px var(--verde);
}
.detalhe img{width:100%;height:100%;object-fit:cover}
.produto h3{
  font-family:var(--f-display);font-weight:400;
  font-size:clamp(1.05rem,2.4vw,1.3rem);line-height:1.25;
  margin-top:26px;
}
.preco{
  font-family:var(--f-texto);font-weight:500;
  color:var(--terracota);font-size:clamp(1.05rem,2.4vw,1.2rem);
  margin-top:6px;
}
.consultar{
  display:inline-block;margin-top:14px;
  font-size:.95rem;font-weight:400;text-decoration:none;
  color:var(--verde);border:1px solid var(--verde);
  padding:8px 22px;border-radius:999px;white-space:nowrap;
}
.consultar:hover{background:var(--verde);color:var(--creme)}
.consultar:focus-visible,.indice a:focus-visible,.rodape a:focus-visible{outline:2px solid var(--salvia);outline-offset:3px}

.aviso{
  text-align:center;font-size:.95rem;color:var(--verde);
  padding:32px 24px clamp(56px,9vw,96px);
}

/* ---------- Rodapé ---------- */
.rodape{background:var(--verde);color:var(--creme);text-align:center;padding:80px 24px 64px}
.rodape .selo{width:150px;height:auto;margin:0 auto}
.rodape .lema{font-size:clamp(1.8rem,5vw,2.6rem);margin:36px auto 28px}
.rodape a{display:block;text-decoration:none;font-size:1.15rem;margin:6px 0}
.rodape a:hover{color:var(--nevoa)}

.placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:12px;font-size:.85rem;color:var(--verde)}

@media (max-width:420px){
  .produtos{column-gap:14px}
  .consultar{padding:7px 16px;font-size:.88rem}
}
</style>
</head>

const AVISO = "*Consulte a disponibilidade de cada produto";

/* ---------- Não é preciso editar daqui para baixo ---------- */
function imagem(src, alt){
  const img = document.createElement("img");
  img.src = src; img.alt = alt; img.loading = "lazy";
  img.onerror = () => img.replaceWith(Object.assign(document.createElement("div"),{className:"placeholder",textContent:"Adicione a URL da foto"}));
  return img;
}
const wa = nome => `https://wa.me/${CONTATO.whatsapp}?text=${encodeURIComponent(`Olá! Gostaria de saber a disponibilidade da ${nome}.`)}`;

const main = document.getElementById("catalogo");

CATEGORIAS.forEach(cat => {
  const sec = document.createElement("section");
  sec.className = "categoria"; sec.id = cat.id;
  const n = cat.produtos.length;
  sec.innerHTML = `
    <div class="moldura">
      <svg class="sol-meio" viewBox="0 0 200 84"><use href="#sol-meio"/></svg>
      <h2>${cat.titulo}</h2>
      <p class="qtd">${n} ${n === 1 ? "modelo" : "modelos"}</p>
      <svg class="sol-meio sol-baixo" viewBox="0 0 200 84"><use href="#sol-meio"/></svg>
    </div>`;
  main.appendChild(sec);

  const grade = document.createElement("div");
  grade.className = "produtos";
  cat.produtos.forEach(p => {
    const art = document.createElement("article");
    art.className = "produto";

    const foto = document.createElement("div");
    foto.className = "foto";
    const quadro = document.createElement("div");
    quadro.className = "quadro";
    quadro.appendChild(imagem(p.foto, p.nome));
    foto.appendChild(quadro);
    if (p.detalhe) {
      const d = document.createElement("div");
      d.className = "detalhe";
      d.appendChild(imagem(p.detalhe, p.nome + " — detalhe"));
      foto.appendChild(d);
    }

    const h3 = document.createElement("h3"); h3.textContent = p.nome;
    const preco = document.createElement("p"); preco.className = "preco"; preco.textContent = p.preco;
    const btn = document.createElement("a");
    btn.className = "consultar"; btn.href = wa(p.nome); btn.target = "_blank"; btn.rel = "noopener";
    btn.textContent = "Consultar";

    art.append(foto, h3, preco, btn);
    grade.appendChild(art);
  });
  main.appendChild(grade);

  const aviso = document.createElement("p");
  aviso.className = "aviso"; aviso.textContent = AVISO;
  main.appendChild(aviso);
});

const insta = document.getElementById("link-insta");
insta.href = `https://instagram.com/${CONTATO.instagram}`; insta.textContent = "@" + CONTATO.instagram;
const whats = document.getElementById("link-whats");
whats.href = `https://wa.me/${CONTATO.whatsapp}`; whats.textContent = CONTATO.whatsappExibido;
</script>
