spring:
  application:
    name: chimaclub
  config:
    import:
      - optional:configtree:/run/secrets/
      - optional:configtree:secrets/
  servlet:
    multipart:
      # 10 MB por arquivo e 25 MB por requisição (§A04). O Tomcat recusa
      # antes de a requisição chegar à aplicação.
      max-file-size: 10MB
      max-request-size: 25MB
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/chimaclub
    username: chimaclub
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    # Nunca em produção: um clean acidental apaga o catálogo inteiro (§A08).
    clean-disabled: true

server:
  port: 8080
  # O conector público segue o mesmo endereço do administrativo. Sem isto o
  # Tomcat liga em todas as interfaces, e em desenvolvimento o catálogo
  # ficaria visível para a rede doméstica inteira; em produção a única
  # barreira seria a publicação do Docker, uma camada só.
  address: ${app.endereco-bind}
  # Não anunciar o servidor nem a sua versão (§A05).
  server-header: ""
  # ---------------------------------------------------------------
  # O Location de um redirecionamento sai como caminho, e não como
  # endereço absoluto.
  #
  # O padrão do Tomcat é o contrário: ele remonta "/admin/produtos" como
  # "http://host:porta/admin/produtos", usando o esquema, o host e a porta
  # que julga que a requisição teve. Atrás de um intermediário esse
  # julgamento vem dos cabeçalhos X-Forwarded-*, e errar qualquer um dos
  # três faz o destino apontar para uma ORIGEM diferente da que o navegador
  # está usando — o X-Forwarded-Host com porta, por exemplo, perde a porta e
  # o destino sai na 443.
  #
  # Aí a CSP entra, e o estrago é silencioso: form-action vale para cada
  # salto do redirecionamento nascido de um formulário, e um salto de outra
  # origem é descartado sem mensagem na tela, só com aviso no console. Em
  # produção isso apareceu como "o login não leva a lugar nenhum": a senha
  # certa deixava a tela de login parada, e a errada nunca chegava ao
  # "?erro" — nem o aviso de senha inválida aparecia.
  #
  # Um caminho relativo é resolvido pelo próprio navegador contra a página
  # em que ele está. Por construção não troca de origem, e deixa de depender
  # do que o intermediário informa. Vale para todas as rotas, não só o
  # login. O redirecionamento do botão de WhatsApp não muda: ele já é um
  # endereço absoluto e externo, e o Tomcat o entrega como está.
  # ---------------------------------------------------------------
  tomcat:
    use-relative-redirects: true
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
  servlet:
    session:
      # 30 minutos de inatividade (§A04). A duração máxima de 8 horas é
      # imposta separadamente, porque o Tomcat só conhece inatividade.
      timeout: 30m
      cookie:
        name: CHIMASESSION
        http-only: true
        same-site: strict
        # Fica true no perfil prod. Em dev o painel responde em http local,
        # e um cookie Secure simplesmente não seria enviado.
        secure: false

# ---------------------------------------------------------------
# Actuator: apenas health e info, e só na porta administrativa.
#
# env, heapdump, threaddump, beans, configprops e mappings ficam de fora por
# omissão — a lista abaixo é de inclusão, não de exclusão, então um ponto
# novo que o Spring passe a oferecer numa versão futura não aparece sozinho.
# ---------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      # Banco e disco só para quem está autenticado: para o anônimo, o
      # health diz apenas se a aplicação responde.
      show-details: when-authorized
      show-components: when-authorized
    info:
      access: read-only
  info:
    env:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false

app:
  porta-admin: 8081
  # HSTS só onde existe TLS. Anunciá-lo sobre http local faria o navegador
  # exigir https daquele host por um ano, e quem administra a loja ficaria
  # sem acesso ao painel na própria máquina.
  hsts-ligado: false
  # Fora do diretório da aplicação, e montado sem permissão de execução em
  # produção (§A08). Em desenvolvimento fica sob ./fotos, que o .gitignore
  # já ignora.
  diretorio-fotos: ${CHIMACLUB_DIRETORIO_FOTOS:./fotos}
  # Chave de 32 bytes em base64, que cifra o segredo do segundo fator em
  # repouso. Em produção vem de variável de ambiente e nunca do repositório;
  # este valor de desenvolvimento não protege nada e não deve ir ao ar.
  chave-totp: ${CHIMACLUB_CHAVE_TOTP:Y2hhdmUtZGUtZGVzZW52b2x2aW1lbnRvLTMyYnl0ZXM=}
  # Dentro do contêiner precisa ser 0.0.0.0: 127.0.0.1 ali é o loopback do
  # próprio contêiner, e a porta ficaria inalcançável pela publicação do
  # Docker. O perfil prod sobrescreve este valor.
  endereco-bind: 127.0.0.1