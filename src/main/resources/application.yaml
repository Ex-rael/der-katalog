spring:
  application:
    name: chimaclub
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/chimaclub
    username: chimaclub
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: America/Sao_Paulo
  flyway:
    enabled: true
    # Nunca em produção: um clean acidental apaga o catálogo inteiro (§A08).
    clean-disabled: true

server:
  port: 8080
  # O conector público segue o mesmo endereço do administrativo. Sem isto o
  # Tomcat liga em todas as interfaces, e em desenvolvimento o catálogo
  # ficaria visível para a rede doméstica inteira; em produção a única
  # barreira seria a publicação do Docker, uma camada só.
  address: ${app.endereco-bind}
  # Não anunciar o servidor nem a sua versão (§A05).
  server-header: ""
  error:
    include-stacktrace: never
    include-message: never
    whitelabel:
      enabled: false
  servlet:
    session:
      # 30 minutos de inatividade (§A04). A duração máxima de 8 horas é
      # imposta separadamente, porque o Tomcat só conhece inatividade.
      timeout: 30m
      cookie:
        name: CHIMASESSION
        http-only: true
        same-site: strict
        # Fica true no perfil prod. Em dev o painel responde em http local,
        # e um cookie Secure simplesmente não seria enviado.
        secure: false

app:
  porta-admin: 8081
  # Chave de 32 bytes em base64, que cifra o segredo do segundo fator em
  # repouso. Em produção vem de variável de ambiente e nunca do repositório;
  # este valor de desenvolvimento não protege nada e não deve ir ao ar.
  chave-totp: ${CHIMACLUB_CHAVE_TOTP:Y2hhdmUtZGUtZGVzZW52b2x2aW1lbnRvLTMyYnl0ZXM=}
  # Dentro do contêiner precisa ser 0.0.0.0: 127.0.0.1 ali é o loopback do
  # próprio contêiner, e a porta ficaria inalcançável pela publicação do
  # Docker. O perfil prod sobrescreve este valor.
  endereco-bind: 127.0.0.1