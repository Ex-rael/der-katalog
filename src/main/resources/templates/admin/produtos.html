<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produtos — Chima Club</title>
  <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header class="barra">
  <span class="marca">Chima Club</span>
  <nav>
    <a th:href="@{/admin/produtos}">Produtos</a>
    <a th:href="@{/admin/configuracao}">Configuração</a>
    <a th:href="@{/admin/auditoria}">Auditoria</a>
  </nav>
  <form method="post" th:action="@{/admin/logout}">
    <button type="submit">Sair</button>
  </form>
</header>

<main>
  <div class="cabecalho-da-pagina">
    <h1>Produtos</h1>
    <a class="botao" th:href="@{/admin/produtos/novo}">Cadastrar produto</a>
  </div>

  <p class="aviso" th:if="${aviso}" th:text="${aviso}"></p>
  <p class="erro" th:if="${erro}" th:text="${erro}"></p>

  <form class="filtros" method="get" th:action="@{/admin/produtos}">
    <div>
      <label for="q">Buscar por nome</label>
      <input type="text" id="q" name="q" th:value="${q}" placeholder="cuia gold">
    </div>
    <div>
      <label for="situacao">Situação</label>
      <select id="situacao" name="situacao">
        <option value="">Todas</option>
        <option value="publicado" th:selected="${situacao == 'publicado'}">Publicados</option>
        <option value="rascunho" th:selected="${situacao == 'rascunho'}">Rascunhos</option>
      </select>
    </div>
    <button type="submit" class="botao-secundario">Filtrar</button>
  </form>

  <p class="vazio" th:if="${#lists.isEmpty(produtos)}">
    Nenhum produto por aqui ainda.
  </p>

  <table th:unless="${#lists.isEmpty(produtos)}">
    <thead>
      <tr>
        <th>Foto</th>
        <th>Nome</th>
        <th>Preço</th>
        <th>Unidades</th>
        <th>Situação</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="produto : ${produtos}">
        <td>
          <div class="sem-foto">sem foto</div>
        </td>
        <!--/* th:text escapa por padrão: um nome com <script> sai como texto. */-->
        <td th:text="${produto.nome}">Nome do produto</td>
        <td class="preco" th:text="${@preco.formatar(produto.precoCentavos)}">R$ 0,00</td>
        <td>
          <span th:if="${produto.unidades > 0}" th:text="${produto.unidades}">0</span>
          <span th:if="${produto.unidades == 0}" class="marca-situacao esgotado">Esgotado</span>
        </td>
        <td>
          <span class="marca-situacao" th:classappend="${produto.publicado} ? 'publicado' : 'rascunho'"
                th:text="${produto.publicado} ? 'Publicado' : 'Rascunho'">Rascunho</span>
        </td>
        <td class="acoes">
          <a class="botao botao-secundario" th:href="@{/admin/produtos/{id}(id=${produto.id})}">Editar</a>

          <form method="post" th:action="@{/admin/produtos/{id}/publicar(id=${produto.id})}">
            <input type="hidden" name="publicar" th:value="${!produto.publicado}">
            <button type="submit" class="botao-secundario"
                    th:text="${produto.publicado} ? 'Despublicar' : 'Publicar'">Publicar</button>
          </form>

          <form method="post" th:action="@{/admin/produtos/{id}/excluir(id=${produto.id})}">
            <button type="submit" class="botao-perigo">Excluir</button>
          </form>
        </td>
      </tr>
    </tbody>
  </table>
</main>

</body>
</html>
