*/-->
<main class="pagina-de-erro">
  <img class="selo" th:src="@{/img/selo-chimaclub.png}" alt="Selo Chima Club" width="120" height="120">

    O endereço pode ter mudado, ou a peça que você procurava saiu do catálogo.
  </p>

  <a class="botao-voltar" th:href="@{/}">Ver o catálogo</a>
</main>
